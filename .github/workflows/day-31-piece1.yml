name: Day 31 Piece 1 CI

on:
  push:
    branches: ["**"]
    paths:
      - "day-31/piece1/ParkFlow/**"
      - ".github/workflows/day-31-piece1.yml"
  pull_request:
    branches: [main]
    paths:
      - "day-31/piece1/ParkFlow/**"
      - ".github/workflows/day-31-piece1.yml"

permissions:
  contents: read

env:
  PROJECT_PATH: day-31/piece1/ParkFlow
  SOLUTION: day-31/piece1/ParkFlow/ParkFlow.slnx
  # Lower than day-4/piece1's 70%: this solution's Api/DI-composition-root/EF-configuration
  # boilerplate (Program.cs, DependencyInjection.cs per module, EF entity configurations) is
  # intentionally not unit-tested line-by-line - see day-31/piece1/README.md's testing-pyramid
  # section for the actual per-layer numbers this threshold is set against.
  COVERAGE_THRESHOLD: 40

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --no-restore --configuration Release

      # Unit + integration (WebApplicationFactory/TestServer) + the one E2E test (a real child
      # process on a real loopback port - see tests/ParkFlow.E2ETests/RealApiProcessFixture.cs) all
      # run here as ordinary `dotnet test`. No Docker/service containers needed: the E2E fixture
      # launches ParkFlow.Api.dll itself and tears it down again per test class.
      - name: Test
        run: >
          dotnet test "$SOLUTION"
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory "$PROJECT_PATH/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.PROJECT_PATH }}/TestResults/**/test-results.trx
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.PROJECT_PATH }}/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

      # dotnet test's --collect:"XPlat Code Coverage" has no built-in threshold gate, so
      # ReportGenerator turns the raw per-project Cobertura XML into one combined line-coverage
      # number the next step can compare against COVERAGE_THRESHOLD.
      - name: Compute coverage summary
        run: |
          set -euo pipefail
          dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.4.7
          export PATH="$PATH:$HOME/.dotnet/tools"

          reportgenerator \
            -reports:"$PROJECT_PATH/TestResults/**/coverage.cobertura.xml" \
            -targetdir:"$PROJECT_PATH/CoverageReport" \
            -reporttypes:TextSummary

          cat "$PROJECT_PATH/CoverageReport/Summary.txt"

      - name: Enforce coverage threshold
        run: |
          set -euo pipefail
          LINE_COVERAGE=$(grep -oP 'Line coverage: \K[0-9.]+' "$PROJECT_PATH/CoverageReport/Summary.txt")
          echo "Line coverage: ${LINE_COVERAGE}% (threshold: ${COVERAGE_THRESHOLD}%)"

          if awk -v cov="$LINE_COVERAGE" -v min="$COVERAGE_THRESHOLD" 'BEGIN { exit !(cov < min) }'; then
            echo "::error::Line coverage ${LINE_COVERAGE}% is below the ${COVERAGE_THRESHOLD}% threshold"
            exit 1
          fi
